name: Compile and Save PDFs to Repo

on:
  push:
    branches:
      - main
    paths:
      # Only run when Markdown files or styles change (ignores PDF pushes)
      - 'manuals/**/*.md'
      - 'styles/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Fetches full history so git push works smoothly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc, WeasyPrint, and Lato Font
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-lato
          pip install weasyprint

      - name: Compile Markdown Files to PDF
        run: |
          find manuals -name "*.md" | while read -r mdfile; do
            dir=$(dirname "$mdfile")
            filename=$(basename "$mdfile" .md)
            pdf_path="${dir}/${filename}.pdf"
            
            echo "Compiling $mdfile to $pdf_path..."
            
            pandoc "$mdfile" \
              --from=gfm \
              --to=html5 \
              --resource-path="$dir" \
              | weasyprint -s styles/pdf-style.css - "$pdf_path"
          done

      - name: Commit and Push Generated PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all newly created or updated PDFs
          git add manuals/**/*.pdf
          
          # Only commit if there are changes to avoid empty commit errors
          if ! git diff --staged --quiet; then
            git commit -m "Auto-compile manual PDFs [skip ci]"
            git push origin main
          else
            echo "No PDF changes detected."
          fi