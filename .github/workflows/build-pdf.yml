name: Compile Accessible PDFs

on:
  push:
    branches:
      - main
    paths:
      - 'manuals/**'
      - 'styles/**'
  workflow_dispatch: # Allows manual triggering from GitHub web UI

jobs:
  build-manuals:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pandoc, WeasyPrint, and Lato Font
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 fonts-lato
          pip install weasyprint

      - name: Compile Markdown Files to PDF
        run: |
          mkdir -p dist
          
          # Find all markdown files in manuals/ and compile them individually
          find manuals -name "*.md" | while read -r mdfile; do
            dir=$(dirname "$mdfile")
            filename=$(basename "$mdfile" .md)
            echo "Compiling $mdfile to dist/${filename}.pdf..."
            
            # 1. Run pandoc relative to the manual folder so local /assets resolve
            # 2. Pipe semantic HTML into WeasyPrint with custom CSS applied
            pandoc "$mdfile" \
              --from=gfm \
              --to=html5 \
              --resource-path="$dir" \
              | weasyprint -s styles/pdf-style.css - "dist/${filename}.pdf"
          done

      - name: Upload Compiled PDFs as Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-guides-pdf
          path: dist/*.pdf
          retention-days: 30